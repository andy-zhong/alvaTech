<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Business Inquiry | Alva Technology</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body data-page="b2b">
  <div id="navbar"></div>

  <main id="page-content">
    <section class="section">
      <div class="b2b-container">

        <!-- 🔥 FIX: kopplad till translations -->
        <h1 id="b2b-title">Contact us as a company</h1>

        <!-- 🔥 FIX: kopplad till translations -->
        <p class="muted" id="b2b-body">
          Looking for a business solution, a fleet setup, or a custom configuration? Fill in the form and our team will contact you.
        </p>

        <form id="b2b-form" class="b2b-form" novalidate>
          <p id="b2b-status" class="b2b-status hidden" role="status" aria-live="polite"></p>

          <div class="form-row">
            <label class="b2b-field">
              <span id="b2b-label-company">Company name</span>
              <input type="text" name="company" autocomplete="organization" />
              <small class="b2b-field-error" data-error-for="company"></small>
            </label>
            <label class="b2b-field">
              <span id="b2b-label-contact">Contact person</span>
              <input type="text" name="contact" autocomplete="name" required />
              <small class="b2b-field-error" data-error-for="contact"></small>
            </label>
          </div>

          <div class="form-row">
            <label class="b2b-field">
              <span id="b2b-label-email">Email address</span>
              <input type="email" name="email" autocomplete="email" required />
              <small class="b2b-field-error" data-error-for="email"></small>
            </label>
            <label class="b2b-field">
              <span id="b2b-label-phone">Phone number</span>
              <input type="tel" name="phone" autocomplete="tel" required />
              <small class="b2b-field-error" data-error-for="phone"></small>
            </label>
          </div>

          <label class="b2b-field">
            <span id="b2b-label-message">Tell us what you're looking for</span>
            <textarea name="message" required></textarea>
            <small class="b2b-field-error" data-error-for="message"></small>
          </label>

          <!-- 🔥 FIX: id för translations -->
          <button id="b2b-submit" type="submit" class="button button--primary">
            Send request
          </button>

          <!-- 🔥 redan korrekt -->
          <p id="b2b-success" class="b2b-success hidden" role="status" aria-live="polite">
            Your request has been sent. We will contact you shortly.
          </p>
        </form>

      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="../js/config.js"></script>
  <script type="module" src="../js/main.js"></script>
</body>
</html>
