<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics | Alva Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/pages/admin.css">
</head>
<body class="admin-body">
  <div id="navbar"></div>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a class="admin-brand" href="/views/admin/orders.html">
        <span class="admin-brand__logo">ALVA</span>
        <span class="admin-brand__label">Admin</span>
      </a>
      <nav class="admin-nav">
        <a class="admin-nav__link" href="/views/admin/orders.html">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
            <rect x="9" y="3" width="6" height="4" rx="1"/>
          </svg>
          Orders
        </a>
        <a class="admin-nav__link is-active" href="/views/admin/analytics.html">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"/>
            <line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="6"  y1="20" x2="6"  y2="14"/>
          </svg>
          Analytics
        </a>
      </nav>
      <div class="admin-sidebar__bottom">
        <p class="admin-sidebar__user" id="admin-name-display"></p>
        <button class="admin-signout" id="signout-btn">Sign out</button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <h1 class="admin-page-title">Analytics</h1>
        <div class="admin-topbar__controls">
          <select class="admin-select" id="days-select">
            <option value="7">Last 7 days</option>
            <option value="30" selected>Last 30 days</option>
            <option value="90">Last 90 days</option>
          </select>
          <button class="admin-btn admin-btn--primary" id="refresh-btn">Refresh</button>
        </div>
      </div>

      <!-- Privacy note -->
      <div style="background:rgba(198,210,71,0.05);border:1px solid rgba(198,210,71,0.14);
                  border-radius:10px;padding:12px 18px;margin-bottom:22px;
                  font-size:0.8rem;opacity:0.72;line-height:1.55;">
        All analytics data is <strong>fully anonymous</strong>.
        No IP addresses, names, or personal identifiers are stored.
        Data is automatically purged after 90 days.
      </div>

      <div id="analytics-state" class="admin-state-msg">Loading analytics…</div>

      <div id="analytics-content" style="display:none;">

        <!-- KPI cards — same .admin-stats grid as orders page -->
        <div class="admin-stats" id="kpi-row"></div>

        <!-- Two tables side by side -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px;">
          <div class="admin-table-wrap">
            <div style="padding:14px 18px 0;font-size:0.72rem;font-weight:600;
                        letter-spacing:.08em;text-transform:uppercase;opacity:.4;">
              Top Pages
            </div>
            <table class="admin-table">
              <thead><tr><th>Page</th><th style="text-align:right;">Views</th></tr></thead>
              <tbody id="top-pages-body"></tbody>
            </table>
          </div>

          <div class="admin-table-wrap">
            <div style="padding:14px 18px 0;font-size:0.72rem;font-weight:600;
                        letter-spacing:.08em;text-transform:uppercase;opacity:.4;">
              Top Clicked Elements
            </div>
            <table class="admin-table">
              <thead><tr><th>Element</th><th style="text-align:right;">Clicks</th></tr></thead>
              <tbody id="top-clicks-body"></tbody>
            </table>
          </div>
        </div>

        <!-- Countries table full width -->
        <div class="admin-table-wrap" style="margin-top:18px;">
          <div style="padding:14px 18px 0;font-size:0.72rem;font-weight:600;
                      letter-spacing:.08em;text-transform:uppercase;opacity:.4;">
            Sessions by Country
          </div>
          <table class="admin-table">
            <thead>
              <tr>
                <th>Country</th>
                <th style="text-align:right;">Sessions</th>
                <th style="text-align:right;">Share</th>
              </tr>
            </thead>
            <tbody id="countries-body"></tbody>
          </table>
        </div>

      </div><!-- /analytics-content -->
    </main>
  </div>

  <div id="footer"></div>

  <script>
    // Auth guard — identical pattern to orders.html and order.html
    const token = localStorage.getItem("adminToken");
    if (!token) { window.location.href = "/views/admin/login.html"; }

    document.getElementById("admin-name-display").textContent =
      localStorage.getItem("adminName") || "Admin";

    document.getElementById("signout-btn").addEventListener("click", () => {
      localStorage.removeItem("adminToken");
      localStorage.removeItem("adminName");
      window.location.href = "/views/admin/login.html";
    });

    function fmtNum(n) { return Number(n).toLocaleString("sv-SE"); }

    const COUNTRY_NAMES = new Intl.DisplayNames(["en"], { type: "region" });
    function countryName(code) {
      try { return COUNTRY_NAMES.of(code); } catch { return code || "Unknown"; }
    }

    function emptyRow(cols, msg) {
      return `<tr><td colspan="${cols}" class="admin-empty-row">${msg}</td></tr>`;
    }

    function render(data) {
      document.getElementById("analytics-state").style.display   = "none";
      document.getElementById("analytics-content").style.display = "block";

      // KPI cards
      document.getElementById("kpi-row").innerHTML = [
        { label: "Sessions",       value: fmtNum(data.sessions)  },
        { label: "Pageviews",      value: fmtNum(data.pageviews) },
        { label: "Clicks",         value: fmtNum(data.clicks)    },
        {
          label: "Pages / Session",
          value: data.sessions > 0 ? (data.pageviews / data.sessions).toFixed(1) : "—",
        },
      ].map((s) => `
        <div class="admin-stat">
          <span class="admin-stat__value">${s.value}</span>
          <span class="admin-stat__label">${s.label}</span>
        </div>`).join("");

      // Top pages
      document.getElementById("top-pages-body").innerHTML =
        data.top_pages.length
          ? data.top_pages.map((r) => `
              <tr>
                <td style="font-size:0.8rem;font-family:monospace;opacity:.8;">${r.page}</td>
                <td style="text-align:right;font-weight:600;">${fmtNum(r.views)}</td>
              </tr>`).join("")
          : emptyRow(2, "No pageview data yet");

      // Top clicked elements
      document.getElementById("top-clicks-body").innerHTML =
        data.top_elements.length
          ? data.top_elements.map((r) => `
              <tr>
                <td>${r.element}</td>
                <td style="text-align:right;font-weight:600;">${fmtNum(r.clicks)}</td>
              </tr>`).join("")
          : emptyRow(2, "No click data yet");

      // Countries
      const total = data.by_country.reduce((s, r) => s + parseInt(r.sessions, 10), 0) || 1;
      document.getElementById("countries-body").innerHTML =
        data.by_country.length
          ? data.by_country.map((r) => `
              <tr>
                <td>
                  ${countryName(r.country_code)}
                  <span style="opacity:.4;font-size:.8rem;margin-left:6px;">${r.country_code}</span>
                </td>
                <td style="text-align:right;">${fmtNum(r.sessions)}</td>
                <td style="text-align:right;opacity:.45;">
                  ${Math.round(parseInt(r.sessions, 10) / total * 100)}%
                </td>
              </tr>`).join("")
          : emptyRow(3, "No country data yet");
    }

    async function load() {
      const days = document.getElementById("days-select").value;
      document.getElementById("analytics-state").textContent  = "Loading analytics…";
      document.getElementById("analytics-state").style.display  = "block";
      document.getElementById("analytics-content").style.display = "none";

      try {
        const res = await fetch(`/api/analytics/summary?days=${days}`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        if (res.status === 401) {
          localStorage.removeItem("adminToken");
          window.location.href = "/views/admin/login.html"; return;
        }
        if (!res.ok) throw new Error(`Server error ${res.status}`);
        render(await res.json());
      } catch (err) {
        document.getElementById("analytics-state").textContent =
          `Failed to load analytics: ${err.message}`;
      }
    }

    document.getElementById("refresh-btn").addEventListener("click",  load);
    document.getElementById("days-select").addEventListener("change", load);
    load();
  </script>
  <script type="module" src="../../js/main.js"></script>
</body>
</html>
