<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Alva Technology</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/pages/admin.css">
</head>
<body class="admin-body">
    <div id="navbar"></div>

  <div class="admin-login-wrap">
    <div class="admin-login-card">

      <p class="admin-login-brand">ALVA TECHNOLOGY</p>
      <h1 class="admin-login-title">Admin Panel</h1>

      <form id="login-form" novalidate>
        <div class="admin-field">
          <label class="admin-label" for="email">Email</label>
          <input class="admin-input" type="email" id="email" placeholder="admin@alvatechnology.com" required>
        </div>
        <div class="admin-field">
          <label class="admin-label" for="password">Password</label>
          <input class="admin-input" type="password" id="password" required>
        </div>

        <div id="login-error" class="admin-error" style="display:none;"></div>

        <button class="admin-btn admin-btn--primary" type="submit" id="submit-btn">
          Sign In
        </button>
      </form>

    </div>
  </div>

  <div id="footer"></div>
  
  <script>
    // If already logged in, skip to orders
    if (localStorage.getItem("adminToken")) {
      window.location.href = "/views/admin/orders.html";
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const btn   = document.getElementById("submit-btn");
      const error = document.getElementById("login-error");
      const email = document.getElementById("email").value.trim();
      const pass  = document.getElementById("password").value;

      btn.disabled    = true;
      btn.textContent = "Signing in…";
      error.style.display = "none";

      try {
        const res  = await fetch("/api/admin/login", {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ email, password: pass }),
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.error || "Login failed");

        localStorage.setItem("adminToken", data.token);
        localStorage.setItem("adminName",  data.name);
        window.location.href = "/views/admin/orders.html";

      } catch (err) {
        error.textContent   = err.message;
        error.style.display = "block";
        btn.disabled        = false;
        btn.textContent     = "Sign In";
      }
    });
  </script>
  <script type="module" src="../../js/main.js"></script>
</body>
</html>
