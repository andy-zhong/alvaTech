<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order | Alva Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/pages/admin.css">
</head>
<body class="admin-body">
    <div id="navbar"></div>

  <div class="admin-layout">

    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <a class="admin-brand" href="/views/admin/orders.html">
        <span class="admin-brand__logo">ALVA</span>
        <span class="admin-brand__label">Admin</span>
      </a>
      <nav class="admin-nav">
        <a class="admin-nav__link" href="/views/admin/orders.html">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
            <rect x="9" y="3" width="6" height="4" rx="1"/>
          </svg>
          Orders
        </a>
      </nav>
      <div class="admin-sidebar__bottom">
        <p class="admin-sidebar__user" id="admin-name-display"></p>
        <button class="admin-signout" id="signout-btn">Sign out</button>
      </div>
    </aside>

    <!-- Main -->
    <main class="admin-main">

      <div class="admin-topbar">
        <div style="display:flex;align-items:center;gap:14px;">
          <a class="admin-back" href="/views/admin/orders.html">← All Orders</a>
          <h1 class="admin-page-title" id="page-title">Order</h1>
        </div>
      </div>

      <div id="order-state" class="admin-state-msg">Loading order…</div>

      <div id="order-content" style="display:none;">

        <!-- Top meta bar -->
        <div class="order-meta-bar">
          <div class="order-meta-bar__left">
            <span class="order-meta-bar__number" id="meta-order-number"></span>
            <span class="badge" id="meta-status-badge"></span>
          </div>
          <div class="order-meta-bar__right">
            <span class="order-meta-bar__date" id="meta-date"></span>
          </div>
        </div>

        <!-- Status update -->
        <div class="order-status-update panel">
          <p class="order-status-update__label">Update Status</p>
          <div class="order-status-update__controls">
            <select class="admin-select" id="status-select">
              <option value="new">New</option>
              <option value="confirmed">Confirmed</option>
              <option value="processing">Processing</option>
              <option value="shipped">Shipped</option>
              <option value="delivered">Delivered</option>
              <option value="cancelled">Cancelled</option>
            </select>
            <button class="admin-btn admin-btn--primary" id="update-status-btn">
              Save Status
            </button>
          </div>
          <p class="order-status-update__feedback" id="status-feedback"></p>
        </div>

        <!-- Two-column detail layout -->
        <div class="order-detail-grid">

          <!-- Left: items + totals -->
          <div>
            <div class="panel order-items-panel">
              <h3 class="order-section-title">Items Ordered</h3>
              <table class="order-items-table" id="items-table">
                <thead>
                  <tr>
                    <th>Product</th>
                    <th class="text-center">Qty</th>
                    <th class="text-right">Unit</th>
                    <th class="text-right">Total</th>
                  </tr>
                </thead>
                <tbody id="items-body"></tbody>
              </table>
              <div class="order-totals" id="order-totals"></div>
            </div>
          </div>

          <!-- Right: customer + address -->
          <div class="order-detail-sidebar">

            <div class="panel">
              <h3 class="order-section-title">Customer</h3>
              <dl class="order-dl" id="customer-dl"></dl>
            </div>

            <div class="panel">
              <h3 class="order-section-title">Delivery Address</h3>
              <address class="order-address" id="order-address"></address>
            </div>

            <div class="panel" id="notes-panel" style="display:none;">
              <h3 class="order-section-title">Customer Note</h3>
              <p class="order-notes" id="order-notes"></p>
            </div>

          </div>

        </div>

      </div><!-- /order-content -->

    </main>
  </div>

  <div id="footer"></div>

  <script>
    // ── Auth guard ──────────────────────────────────────────────────────────
    const token = localStorage.getItem("adminToken");
    if (!token) { window.location.href = "/views/admin/login.html"; }

    document.getElementById("admin-name-display").textContent =
      localStorage.getItem("adminName") || "Admin";

    document.getElementById("signout-btn").addEventListener("click", () => {
      localStorage.removeItem("adminToken");
      localStorage.removeItem("adminName");
      window.location.href = "/views/admin/login.html";
    });

    // ── Helpers ─────────────────────────────────────────────────────────────
    const orderId = new URLSearchParams(window.location.search).get("id");

    if (!orderId) {
      window.location.href = "/views/admin/orders.html";
    }

    const STATUS_COLORS = {
      new:        "badge--blue",
      confirmed:  "badge--teal",
      processing: "badge--yellow",
      shipped:    "badge--purple",
      delivered:  "badge--green",
      cancelled:  "badge--red",
    };

    function fmt(n) {
      return Number(n).toLocaleString("sv-SE") + " SEK";
    }

    function fmtDate(iso) {
      return new Date(iso).toLocaleString("sv-SE", {
        year: "numeric", month: "short", day: "numeric",
        hour: "2-digit", minute: "2-digit",
      });
    }

    function dl(label, value) {
      if (!value) return "";
      return `<div class="order-dl__row">
                <dt>${label}</dt>
                <dd>${value}</dd>
              </div>`;
    }

    // ── Render ───────────────────────────────────────────────────────────────
    function render(order, items) {
      document.getElementById("order-state").style.display   = "none";
      document.getElementById("order-content").style.display = "block";

      // Title + meta bar
      document.getElementById("page-title").textContent = order.order_number;
      document.getElementById("meta-order-number").textContent = order.order_number;
      document.getElementById("meta-date").textContent = fmtDate(order.created_at);

      const badge = document.getElementById("meta-status-badge");
      badge.textContent = order.status;
      badge.className   = `badge ${STATUS_COLORS[order.status] || "badge--grey"}`;

      // Status select
      document.getElementById("status-select").value = order.status;

      // Items table
      const tbody = document.getElementById("items-body");
      tbody.innerHTML = items.map((item) => {
        const configLine = item.is_configurable
          ? `<br><span class="order-item-config">
               ${item.battery_count} battery module${item.battery_count === 1 ? "" : "s"}
               &nbsp;·&nbsp; ${item.capacity_kwh} kWh
             </span>`
          : "";
        return `
          <tr>
            <td>${item.product_name}${configLine}</td>
            <td class="text-center">${item.quantity}</td>
            <td class="text-right">${fmt(item.unit_price)}</td>
            <td class="text-right order-item-total">${fmt(item.line_total)}</td>
          </tr>`;
      }).join("");

      // Totals
      document.getElementById("order-totals").innerHTML = `
        <div class="order-totals__row">
          <span>Subtotal</span>
          <span>${fmt(order.subtotal)}</span>
        </div>
        <div class="order-totals__row">
          <span>Shipping</span>
          <span class="order-totals__pending">Calculated separately</span>
        </div>
        <div class="order-totals__row order-totals__row--total">
          <span>Total</span>
          <span>${fmt(order.total)}</span>
        </div>`;

      // Customer
      document.getElementById("customer-dl").innerHTML =
        dl("Name",    `${order.first_name} ${order.last_name}`) +
        dl("Email",   `<a href="mailto:${order.email}">${order.email}</a>`) +
        dl("Phone",   order.phone) +
        dl("Company", order.company) +
        dl("Org nr",  order.org_number);

      // Address
      document.getElementById("order-address").innerHTML = [
        order.street,
        `${order.postal_code} ${order.city}`,
        order.country,
      ].filter(Boolean).join("<br>");

      // Notes
      if (order.notes) {
        document.getElementById("notes-panel").style.display = "block";
        document.getElementById("order-notes").textContent   = order.notes;
      }
    }

    // ── Status update ────────────────────────────────────────────────────────
    document.getElementById("update-status-btn").addEventListener("click", async () => {
      const btn      = document.getElementById("update-status-btn");
      const feedback = document.getElementById("status-feedback");
      const status   = document.getElementById("status-select").value;

      btn.disabled    = true;
      btn.textContent = "Saving…";
      feedback.textContent   = "";
      feedback.className     = "order-status-update__feedback";

      try {
        const res = await fetch(`/api/admin/orders/${orderId}/status`, {
          method:  "PATCH",
          headers: {
            "Content-Type": "application/json",
            Authorization:  `Bearer ${token}`,
          },
          body: JSON.stringify({ status }),
        });

        if (res.status === 401) {
          localStorage.removeItem("adminToken");
          window.location.href = "/views/admin/login.html";
          return;
        }

        const updated = await res.json();
        if (!res.ok) throw new Error(updated.error || "Update failed");

        // Refresh badge
        const badge = document.getElementById("meta-status-badge");
        badge.textContent = updated.status;
        badge.className   = `badge ${STATUS_COLORS[updated.status] || "badge--grey"}`;

        feedback.textContent = "✓  Status updated";
        feedback.classList.add("is-success");

      } catch (err) {
        feedback.textContent = err.message;
        feedback.classList.add("is-error");
      } finally {
        btn.disabled    = false;
        btn.textContent = "Save Status";
        setTimeout(() => { feedback.textContent = ""; feedback.className = "order-status-update__feedback"; }, 3000);
      }
    });

    // ── Load ─────────────────────────────────────────────────────────────────
    async function loadOrder() {
      try {
        const res = await fetch(`/api/admin/orders/${orderId}`, {
          headers: { Authorization: `Bearer ${token}` },
        });

        if (res.status === 401) {
          localStorage.removeItem("adminToken");
          window.location.href = "/views/admin/login.html";
          return;
        }

        if (res.status === 404) {
          document.getElementById("order-state").textContent = "Order not found.";
          return;
        }

        const { order, items } = await res.json();
        render(order, items);

      } catch (err) {
        document.getElementById("order-state").textContent =
          "Failed to load order. Is the server running?";
      }
    }

    loadOrder();
  </script>
  <script type="module" src="../../js/main.js"></script>
</body>
</html>
